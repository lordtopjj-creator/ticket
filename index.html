<!DOCTYPE html>

<html lang="uk">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Електронний квиток</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
function updateCutlineHoles(){
 const ticket=document.querySelector('.ticket');
 const cut=document.querySelector('.cutline');
 if(ticket && cut){
   const r1=ticket.getBoundingClientRect();
   const r2=cut.getBoundingClientRect();
   const center=(r2.top-r1.top)+(r2.height/2);
   ticket.style.setProperty('--cutline-center', center+'px');
 }
}

function fitTimer(){
 const el=document.getElementById('timerInput');
 const len=el.value.length;
 let size=46;
 if(len>8) size=38;
 if(len>12) size=32;
 el.style.fontSize=size+'px';
}

function limitNumeric(id,maxLen){
 const el=document.getElementById(id);
 if(!el) return;
 el.addEventListener('input',()=>{
   el.value=el.value.replace(/\D/g,'').slice(0,maxLen);
 });
}

limitNumeric('amount',3);
limitNumeric('tickets',3);

window.addEventListener('load',()=>{
 updateCutlineHoles();
 fitTimer();
});
window.addEventListener('resize',()=>{
 updateCutlineHoles();
 fitTimer();
});

timerInput.addEventListener('input',fitTimer);

</script>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#b7dddd;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;
    justify-content:center;
    padding:24px;
}
.ticket{
    width:640px;
    max-width:100%;
    background:#f9f9f9;
    border-radius:18px;
    position:relative;
    padding:26px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}
.ticket:before,.ticket:after{
    content:"";
    position:absolute;
    width:28px;height:28px;
    background:#b7dddd;
    border-radius:50%;
    top:var(--cutline-center,178px);
}
.ticket:before{left:-14px}
.ticket:after{right:-14px}

.header{display:flex;justify-content:space-between;align-items:center}
.logo-wrap{display:flex;align-items:center;gap:14px}
.logo{
    width:52px;height:52px;
    background:#c81d25;
    border-radius:12px;
}
.title{font-size:20px;color:#6d6d6d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo-wrap{min-width:0}

.info-btn{
    width:38px;height:38px;border:3px solid #1d8be3;
    color:#1d8be3;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:22px;
}

.meta{
    margin-top:18px;
    display:grid;
    grid-template-columns:1fr auto;
    row-gap:12px;
    font-size:24px;
}
.label{color:#7d7d7d}
.value{font-weight:600;color:#444;text-align:right;width:100%;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#series{color:#8a8a8a;}
.board-input{min-width:0;overflow:hidden;text-overflow:ellipsis;
    border:none;background:transparent;
    font-size:29px;font-weight:700;
    text-align:right;
    width:100%;
    margin-right:0;
    padding-right:0;
    min-width:0;
}

.cutline{
    border-top:4px dashed #e2e2e2;
    margin:22px 0 30px;
}

.qr-block{text-align:center}.qr-block #qrcode{display:flex;justify-content:center}.qr-block canvas,.qr-block img{max-width:100%;height:auto}
.qr-button{
    display:inline-flex;
    align-items:center;
    gap:10px;
    border:2px solid #77b65a;
    color:#5da53e;
    padding:14px 28px;
    border-radius:14px;
    font-size:22px;
    margin-top:20px;
}

.stats{
    margin-top:26px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    text-align:center;
}
.stats .head{color:#777;font-size:18px}
.stats .val{font-size:20px;margin-top:8px;white-space:nowrap;font-weight:700}

.ticket-type{
    text-align:center;
    font-size:22px;
    margin-top:24px;
}

.timer{
    text-align:center;
    font-size:58px;
    color:#62a93f;
    font-weight:500;
    margin:14px 0;
}

.badge{
    display:block;
    width:max-content;
    margin:0 auto;
    background:#e4f0dd;
    color:#5e9d42;
    padding:10px 18px;
    border-radius:8px;
    font-size:22px;
}

@media (max-width: 768px){
    body{padding:10px;}
    .ticket{width:100%;padding:18px;border-radius:14px;}
    .meta{font-size:20px;}
    .title{font-size:16px;}
    .timer,input#timerInput{font-size:36px !important;width:auto !important;}
    .stats .head{font-size:15px;}
    .stats .val{font-size:17px;}
    .ticket-type,.badge,.qr-button{font-size:18px;}
}
@media (max-width: 480px){
    .ticket{padding:14px;border-radius:12px;}
    .logo-wrap{gap:8px;}
    .title{font-size:14px;}
    .meta{font-size:16px;grid-template-columns:1fr 1fr;}
    .board-input{min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:22px;}
    #timerInput{font-size:32px !important;width:140px !important;}
    #dateInput{font-size:14px !important;width:100% !important;}
    .stats .head{font-size:12px;}
    .stats .val,input#amount,input#tickets{font-size:14px !important;}
    .qr-button,.badge,.ticket-type{font-size:14px;}
}
@media (max-width: 320px){
    #timerInput{font-size:28px !important;width:120px !important;}
    .board-input{min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:18px;}
}
</style>
</head>

<script>
function generateSeries(){return "РВ №"+Math.floor(Math.random()*900000000+100000000);}
document.getElementById("series").innerText=generateSeries();

const dateInput=document.getElementById("dateInput");
function toLocalDateTimeValue(d){
 const pad=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
dateInput.value=toLocalDateTimeValue(new Date());

function formatDateShort(value){
 const d=new Date(value);
 if(isNaN(d)) return '';
 const months=['січ.','лют.','бер.','квіт.','трав.','черв.','лип.','серп.','вер.','жовт.','лист.','груд.'];
 return `${String(d.getDate()).padStart(2,'0')} ${months[d.getMonth()]} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function showFormattedDate(){
 const display=document.getElementById('dateDisplay');
 if(display) display.textContent=formatDateShort(dateInput.value);
}
dateInput.addEventListener('change',showFormattedDate);
showFormattedDate();

let t=3600;
const timerInput=document.getElementById('timerInput');

function renderTimer(){
 let m=Math.floor(t/60),s=t%60;
 if(document.activeElement!==timerInput){
   timerInput.value=`${m}:${String(s).padStart(2,'0')}`;
 }
}

function updateFromInput(){
 const parts=timerInput.value.split(':');
 if(parts.length===2){
   const m=parseInt(parts[0])||0;
   const s=parseInt(parts[1])||0;
   t=m*60+s;
   renderTimer();
 }
}

timerInput.addEventListener('input',updateFromInput);
timerInput.addEventListener('change',updateFromInput);

renderTimer();

setInterval(()=>{
 if(t>0)t--;
 renderTimer();
},1000);


function updateLayout(){
 const cutline=document.querySelector('.cutline');
 const ticket=document.querySelector('.ticket');
 if(cutline&&ticket){
   const top=cutline.offsetTop;
   ticket.style.setProperty('--cutline-top', top+'px');
 }
 const qr=document.getElementById('qrcode');
 const size=Math.max(90,Math.min(140,Math.floor(window.innerWidth*0.28)));
 qr.innerHTML='';
 new QRCode(qr,{text:"TICKET|"+Date.now(),width:size,height:size});
}
window.addEventListener('load',updateLayout);
window.addEventListener('resize',updateLayout);


function updateCutlineHoles(){
 const ticket=document.querySelector('.ticket');
 const cut=document.querySelector('.cutline');
 if(ticket && cut){
   const r1=ticket.getBoundingClientRect();
   const r2=cut.getBoundingClientRect();
   const center=(r2.top-r1.top)+(r2.height/2);
   ticket.style.setProperty('--cutline-center', center+'px');
 }
}

function fitTimer(){
 const el=document.getElementById('timerInput');
 const len=el.value.length;
 let size=46;
 if(len>8) size=38;
 if(len>12) size=32;
 el.style.fontSize=size+'px';
}

function limitNumeric(id,maxLen){
 const el=document.getElementById(id);
 if(!el) return;
 el.addEventListener('input',()=>{
   el.value=el.value.replace(/\D/g,'').slice(0,maxLen);
 });
}

limitNumeric('amount',3);
limitNumeric('tickets',3);

window.addEventListener('load',()=>{
 updateCutlineHoles();
 fitTimer();
});
window.addEventListener('resize',()=>{
 updateCutlineHoles();
 fitTimer();
});

timerInput.addEventListener('input',fitTimer);

</script>

<div id="qrModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000000cc;justify-content:center;align-items:center;z-index:9999;">
<div style="background:white;padding:20px;border-radius:12px;text-align:center;">
<div id="realQR"></div>
<br/>
<button onclick="closeQR()" style="padding:10px 20px;">Закрити</button>
</div>
</div>
<style>
#qrModal{
opacity:0;
transition:opacity .35s ease;
}
#qrModal.show{opacity:1;}
.qr-block{
transition:transform .35s ease,opacity .35s ease;
}
.qr-block.zoom-out{
transform:scale(.92);
opacity:.2;
}
</style>
<script>
let previousQRContent='';

function openQR(){
    const modal=document.getElementById('qrModal');
    const qr=document.getElementById('realQR');
    modal.style.display='flex';
    requestAnimationFrame(()=>modal.classList.add('show'));
    qr.innerHTML='';
    new QRCode(qr,{text:"TICKET|"+Date.now(),width:260,height:260});
}

function closeQR(){
    const modal=document.getElementById('qrModal');
    modal.classList.remove('show');
    setTimeout(()=>{
        modal.style.display='none';
    },350);

    if(previousQRContent){
        const qrBlock=document.querySelector('.qr-block');
        qrBlock.innerHTML=previousQRContent;
        qrBlock.classList.remove('zoom-out');
    }
}

document.addEventListener('click',function(e){
    if(e.target && e.target.id==='openQR'){
        const qrBlock=document.querySelector('.qr-block');
        previousQRContent=qrBlock.innerHTML;

        qrBlock.classList.add('zoom-out');

        setTimeout(()=>{
            qrBlock.innerHTML='<div id="inlineQR" style="display:flex;justify-content:center;cursor:pointer;"></div>';
            new QRCode(document.getElementById('inlineQR'),{text:"TICKET|"+Date.now(),width:220,height:220});
            document.getElementById('inlineQR').addEventListener('click', goBackQR);
            qrBlock.classList.remove('zoom-out');
        },300);
    }
});

function goBackQR(){
    const qrBlock=document.querySelector('.qr-block');
    qrBlock.classList.add('zoom-out');
    setTimeout(()=>{
        qrBlock.innerHTML=previousQRContent;
        qrBlock.classList.remove('zoom-out');
    },300);
}
</script></body>
</html>
